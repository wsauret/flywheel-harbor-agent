# Flywheel config of a gpt-6-luna arm that turns off the advisor, reviewer, and ship agent types with subagents.disabled_types.
# It runs the ChatGPT subscription route of the person's auth profile. Every
# role runs gpt-6-luna at effort high, so one model serves the whole trial.
# The launcher validates this file with Flywheel's config schema before any
# trial and installs it in the trial as $HOME/.flywheel/flywheel.toml under
# the neutral auth profile id "benchmark".

allow_persistent_processes = true
# Headless shell commands write in place; the guard that stops a write
# outside the project would refuse ordinary task setup such as package installs.
shell_write_guard = false
idle_compaction = false
auto_delete_session_days = 0

disabled_modules = [
  "ask-user",
  "bug-reports",
  "code-mode",
  "development",
  "experiments",
  "learning",
  "mcp",
  "papercuts",
  "project-notifications",
  "provider-anthropic-api",
  "provider-claude-agent-sdk",
  "provider-deepseek",
  "provider-github-copilot",
  "provider-google-api",
  "provider-google-vertex",
  "provider-openai-api",
  "provider-opencode-go",
  "provider-openrouter",
  "provider-supergrok",
  "remote",
  "side-question",
  "web",
  "web-chatgpt",
  "web-exa",
  "workflows",
]

# Subagents stay on with the agent types that do the task's work. The advisor and
# the reviewers give a second opinion from another model, which a run of one
# model cannot give, and nothing in a trial publishes.
[subagents]
disabled_types = ["advisor", "reviewer", "ship"]

[updates]
auto_install = false

[profiles.benchmark]
allow_training_routes = false

[profiles.benchmark.roles.chat]
model = "gpt-6-luna"
effort = "high"

[profiles.benchmark.roles.title-generation]
model = "gpt-6-luna"
effort = "high"

[profiles.benchmark.roles.subagent-summary]
model = "gpt-6-luna"
effort = "high"

[profiles.benchmark.roles.explorer]
model = "gpt-6-luna"
effort = "high"

[profiles.benchmark.roles.implementer]
model = "gpt-6-luna"
effort = "high"

[diagnostic]
first_block_text = '''
# Finishing
The work is finished when the result exists and a check of each thing that the request names has passed on it. At that moment, write the final message and stop.
A check that passed closes its question: do not argue again about a choice that you already made, and start no new test, edge case, cleanup edit, refactor, or record-keeping step. The only reason to go back is a check that you have just seen fail.
A doubt that remains is one sentence in the final message.

# Open readings
When the request can be read in more than one way, choose the reading that its words state, write the choice down as one line, and continue.
Decide each such question once. Return to it only when a check fails or when you read something new in the request or in the files; a check that passed is not a reason to argue the choice again.
Name each choice in the final message.

# Final message
The final message has at most six lines: what you made, where it is, how you checked it, and each choice that the request left open.
Write it directly. Do not draft it, list its possible contents, or weigh its wording in your reasoning first.
'''

# Flywheel config of the DeepSeek 1017 max-effort arm, matched to the
# FrontierHarness v1.1 board (frontierharness.org): every harness there runs
# DeepSeek-V4.1-Flash-1017 at max effort, served by Baseten, 62 tasks x 4
# attempts. This arm runs the same model at max effort on every role, over the
# same tasks and attempts.
#
# Known differences from the board:
# - Route. Flywheel resolves the one model "deepseek-v4.1-flash-1017" from
#   three providers and walks them in its fixed spend order: the OpenCode Go
#   subscription (included quota) first, then the DeepSeek API (first-party,
#   wire id "deepseek-flash"), then OpenRouter. A request moves to the next
#   provider only when one refuses for spent quota, throttling, overload, or
#   an outage, so one trial can be served by more than one provider. Each
#   attempt records the provider that served it.
# - Provider. Only the OpenRouter leg is the board's own route: it is
#   restricted to Baseten's standard endpoint with no fallback. OpenCode Go and
#   the DeepSeek API serve the same weights through other hosts.
# - Cost. The run's own cost mixes included use (OpenCode Go), DeepSeek list
#   prices, and Baseten prices. Compare cost per pass with the board by
#   repricing each trial's tokens at Baseten's list price.
# - Effort. Max on every role, including the short title-generation role.
#
# The launcher validates this file with Flywheel's config schema before any
# trial, records its sha256 in run_manifest.json, and installs it in the trial
# as $HOME/.flywheel/flywheel.toml. The trial exports its credentials under the
# neutral auth profile id "benchmark", so the profile tables below apply. The
# snapshot carries the credentials of the three enabled provider modules.

allow_persistent_processes = true
# Headless shell commands write in place; the guard that stops a write
# outside the project would refuse ordinary task setup such as package installs.
shell_write_guard = false
idle_compaction = false
auto_delete_session_days = 0

disabled_modules = [
  "ask-user",
  "bug-reports",
  "code-mode",
  "development",
  "experiments",
  "learning",
  "mcp",
  "papercuts",
  "project-notifications",
  "provider-anthropic-api",
  "provider-claude-agent-sdk",
  "provider-github-copilot",
  "provider-google-api",
  "provider-google-vertex",
  "provider-openai-api",
  "provider-chatgpt",
  "provider-supergrok",
  "remote",
  "side-question",
  "web",
  "web-chatgpt",
  "web-exa",
  "workflows",
]

# Subagents stay on with the agent types that do the task's work. The advisor and
# the reviewers give a second opinion from another model, which a run of one
# model cannot give, and nothing in a trial publishes.
[subagents]
disabled_types = ["advisor", "reviewer", "ship"]

[updates]
auto_install = false

[profiles.benchmark]
allow_training_routes = false

# The board runs one model in a trial, so automatic titles use the chat route too.
# "baseten" matches every Baseten endpoint, so its 2x-priced fast tier is excluded by name.
[profiles.benchmark.roles.chat]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[profiles.benchmark.roles.explorer]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[profiles.benchmark.roles.implementer]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[profiles.benchmark.roles.subagent-summary]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[profiles.benchmark.roles.title-generation]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[diagnostic]
first_block_text = '''
# Finishing
Decide once that the work is finished. The moment you begin to plan your final message, the work is finished: write the message and stop.
After that moment, start no new test, edge case, cleanup edit, refactor, or record-keeping step. The only reason to go back is a check that you have just seen fail.
A new doubt at that moment is one sentence in the final message.

## Personality

Your default personality and tone is concise, direct, and friendly. You communicate efficiently, always keeping the user clearly informed about ongoing actions without unnecessary detail. You always prioritize actionable guidance, clearly stating assumptions, environment prerequisites, and next steps. Unless explicitly asked, you avoid excessively verbose explanations about your work.

### Preamble messages

Before making tool calls, send a brief preamble to the user explaining what you’re about to do. When sending preamble messages, follow these principles and examples:

- **Logically group related actions**: if you’re about to run several related commands, describe them together in one preamble rather than sending a separate note for each.
- **Keep it concise**: be no more than 1-2 sentences, focused on immediate, tangible next steps. (8–12 words for quick updates).
- **Build on prior context**: if this is not your first tool call, use the preamble message to connect the dots with what’s been done so far and create a sense of momentum and clarity for the user to understand your next actions.
- **Keep your tone light, friendly and curious**: add small touches of personality in preambles feel collaborative and engaging.
- **Exception**: Avoid adding a preamble for every trivial read (e.g., `cat` a single file) unless it’s part of a larger grouped action.

**Examples:**

- “I’ve explored the repo; now checking the API route definitions.”
- “Next, I’ll patch the config and update the related tests.”
- “I’m about to scaffold the CLI commands and helper functions.”
- “Ok cool, so I’ve wrapped my head around the repo. Now digging into the API routes.”
- “Config’s looking tidy. Next up is patching helpers to keep things in sync.”
- “Finished poking at the DB gateway. I will now chase down error handling.”
- “Alright, build pipeline order is interesting. Checking how it reports failures.”
- “Spotted a clever caching util; now hunting where it gets used.”

## Sharing progress updates

For especially longer tasks that you work on (i.e. requiring many tool calls, or a plan with multiple steps), you should provide progress updates back to the user at reasonable intervals. These updates should be structured as a concise sentence or two (no more than 8-10 words long) recapping progress so far in plain language: this update demonstrates your understanding of what needs to be done, progress so far (i.e. files explores, subtasks complete), and where you're going next.

Before doing large chunks of work that may incur latency as experienced by the user (i.e. writing a new file), you should send a concise message to the user with an update indicating what you're about to do to ensure they know what you're spending time on. Don't start editing or writing large files before informing the user what you are doing and why.

The messages you send before tool calls should describe what is immediately about to be done next in very concise language. If there was previous work done, this preamble message should also include a note about the work done so far to bring the user along.
'''

# Flywheel config of the Haiku arm of DeepSWE 1.1 (dswe-haiku-high.toml) with
# subagents on and only the three working subagent types offered: general,
# explorer, and implementer. It offers no advisor, no reviewer, and no Ship,
# because one model serves the whole trial. It differs from
# dswe-haiku-high-sub-full.toml only in the allowlist, and from
# dswe-haiku-high.toml only in the enabled subagents module and its allowlist. It keeps
# every setting of the board-matched DeepSeek arm (tb-board-deepseek-high.toml)
# except the model route: it runs Flywheel's Claude engine route on the
# person's Claude subscription, with the token that the person made with
# `claude setup-token`, which the trial's auth snapshot carries (PI-MODEL-082).
# Every role runs claude-haiku-5.5 at effort high, so one model serves the
# whole trial. The launcher validates this file with Flywheel's config schema
# before any trial and installs it in the trial as $HOME/.flywheel/flywheel.toml
# under the neutral auth profile id "benchmark".

allow_persistent_processes = true
# Headless shell commands write in place; the guard that stops a write
# outside the project would refuse ordinary task setup such as package installs.
shell_write_guard = false
idle_compaction = false
auto_delete_session_days = 0

disabled_modules = [
  "ask-user",
  "bug-reports",
  "code-mode",
  "development",
  "experiments",
  "learning",
  "mcp",
  "papercuts",
  "project-notifications",
  "provider-anthropic-api",
  "provider-chatgpt",
  "provider-deepseek",
  "provider-github-copilot",
  "provider-google-api",
  "provider-google-vertex",
  "provider-openai-api",
  "provider-opencode-go",
  "provider-openrouter",
  "provider-supergrok",
  "remote",
  "side-question",
  "web",
  "web-chatgpt",
  "web-exa",
  "workflows",
]

[updates]
auto_install = false

[subagents]
personas = ["general", "explorer", "implementer"]

[profiles.benchmark]
allow_training_routes = false

[profiles.benchmark.roles.chat]
model = "claude-haiku-5.5"
effort = "high"

